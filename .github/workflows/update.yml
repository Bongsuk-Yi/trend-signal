name: Update and Deploy

# 수집(collect)은 사용자 PC의 self-hosted 러너에서 돌린다.
# data.go.kr 이 해외 IP를 차단하기 때문에 부동산 실거래는 한국에서만 받을 수 있다.
# 배포(deploy)는 GitHub 서버에서 해도 되므로 ubuntu-latest 를 그대로 쓴다.

on:
  schedule:
    # 매일 오전 7시 30분 KST (= 22:30 UTC 전날)
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trend-update
  cancel-in-progress: false

jobs:
  # ── 1) 수집: 한국 IP 필요 → 사용자 PC ─────────────────────────
  collect:
    runs-on: self-hosted
    timeout-minutes: 20
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check Python
        # self-hosted 러너에서는 actions/setup-python 이 자체 설치를 시도하다 실패하는
        # 경우가 있어(Windows 설치 스크립트 이슈), PC에 미리 설치된 파이썬을 그대로 쓴다.
        run: python --version

      - name: Install dependencies
        run: python -m pip install --quiet --upgrade cryptography

      - name: Decrypt previous data (for history)
        continue-on-error: true
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -f site/data/latest.enc.json ]; then
            python scripts/crypt.py decrypt site/data/latest.enc.json build/prev.json || true
          else
            echo "No previous data - first run"
          fi

      - name: Collect data
        env:
          PREV_JSON: build/prev.json
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/collect.py build/latest.json

      - name: Encrypt
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          python scripts/crypt.py encrypt build/latest.json site/data/latest.enc.json
          rm -rf build

      - name: Commit data
        run: |
          git config user.name  "trend-bot"
          git config user.email "actions@github.com"
          git add -f site/data/latest.enc.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git pull --rebase --autostash origin main || true
            git push
          fi

  # ── 2) 배포: GitHub 서버 ──────────────────────────────────────
  deploy:
    needs: collect
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout (with fresh data)
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
