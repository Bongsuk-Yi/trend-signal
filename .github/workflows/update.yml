name: Update and Deploy

on:
  schedule:
    # 매일 오전 7시 30분 KST (= 22:30 UTC 전날)
    - cron: "30 22 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "scripts/**"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: trend-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install --quiet cryptography

      - name: Decrypt previous data (for history)
        continue-on-error: true
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          if [ -f site/data/latest.enc.json ]; then
            python scripts/build.py decrypt site/data/latest.enc.json build/prev.json || true
          else
            echo "No previous data - first run"
          fi

      - name: Collect data
        env:
          PREV_JSON: build/prev.json
          DATA_GO_KR_KEY: ${{ secrets.DATA_GO_KR_KEY }}
        run: python scripts/build.py collect build/latest.json

      - name: Encrypt
        env:
          SITE_PASSWORD: ${{ secrets.SITE_PASSWORD }}
        run: |
          python scripts/build.py encrypt build/latest.json site/data/latest.enc.json
          rm -rf build

      - name: Commit data
        run: |
          git config user.name  "trend-bot"
          git config user.email "actions@github.com"
          git add -f site/data/latest.enc.json
          if git diff --staged --quiet; then
            echo "No changes"
          else
            git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M KST')"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
